[package]
name = "rpg-library"
version = "0.1.0"
description = "RPG Maker Library — prototipo Tauri (Fase 1, solo lectura)"
edition = "2021"
rust-version = "1.80"
default-run = "rpg-library"

[lib]
name = "rpg_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "gen_synth"
path = "src/bin/gen_synth.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
