[package]
name = "rpg-library"
version = "0.9.0"
description = "RPG Maker Library — catálogo local de juegos RPG Maker"
edition = "2021"
rust-version = "1.80"
default-run = "rpg-library"

[lib]
name = "rpg_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "gen_synth"
path = "src/bin/gen_synth.rs"

[[bin]]
name = "import_validate"
path = "src/bin/import_validate.rs"

[[bin]]
name = "parity"
path = "src/bin/parity.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "functions", "backup"] }
base64 = "0.22"
thiserror = "2"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
webp = { version = "0.3", default-features = false }
regex = "1"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# Almacén seguro del sistema para las contraseñas por página (ADR-019). Sin un backend
# nativo activado, keyring 3 cae en silencio a un almacén en memoria: por eso cada
# plataforma objetivo declara el suyo.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
